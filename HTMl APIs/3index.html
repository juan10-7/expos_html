<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Drag and Drop API</title>

<style>

#div1 {
  width: 350px;
  height: 120px;
  padding: 10px;
  border: 2px solid black;
}

</style>

<script>

function allowDrop(ev) {
  ev.preventDefault();
}

function drag(ev) {
  ev.dataTransfer.setData("text", ev.target.id);
}

function drop(ev) {
  ev.preventDefault();
  const data = ev.dataTransfer.getData("text");
  ev.target.appendChild(document.getElementById(data));
}

</script>

</head>

<body>

<h2>HTML Drag and Drop API</h2>

<p>Arrastra la imagen hasta el recuadro.</p>

<div id="div1"
    ondrop="drop(event)"
    ondragover="allowDrop(event)">
</div>

<br>

<img
id="drag1"
src="https://www.w3schools.com/html/img_logo.gif"
draggable="true"
ondragstart="drag(event)"
width="336"
height="69">

</body>
</html>
